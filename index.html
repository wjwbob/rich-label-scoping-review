<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rich Affective Ground Truth</title>
    <meta
      name="description"
      content="Interactive literature map for rich affective ground truth, including bibliographic details, categories, and rationale-oriented review notes."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap"
      rel="stylesheet"
    />
    <script>
      window.tailwind = window.tailwind || {};
      window.tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ["DM Sans", "sans-serif"],
              display: ["Fraunces", "serif"]
            },
            boxShadow: {
              soft: "0 18px 60px rgba(15, 23, 42, 0.08)"
            }
          }
        }
      };
    </script>
    <script src="https://cdn.tailwindcss.com?plugins=line-clamp"></script>
    <style>
      :root {
        color-scheme: light;
      }

      body {
        font-family: "DM Sans", sans-serif;
        background:
          radial-gradient(circle at top left, rgba(16, 185, 129, 0.16), transparent 24rem),
          radial-gradient(circle at top right, rgba(14, 165, 233, 0.14), transparent 28rem),
          linear-gradient(180deg, #f8fafc 0%, #eef2ff 100%);
      }

      h1,
      h2,
      h3 {
        font-family: "Fraunces", serif;
      }
    </style>
  </head>
  <body class="min-h-screen text-slate-950 antialiased">
    <div id="root"></div>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script>
      fetch("./app.jsx")
        .then((response) => response.text())
        .then((source) => {
          const compiled = Babel.transform(source, {
            presets: [["react", { runtime: "classic" }]],
            filename: "app.jsx"
          }).code;
          const script = document.createElement("script");
          script.textContent = compiled;
          document.body.appendChild(script);
        });
    </script>
  </body>
</html>
